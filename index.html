<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
    --border: #2a2a2a; --text: #f0f0f0; --text2: #888; --text3: #555;
    --accent: #c8f060; --accent2: #60d4f0; --accent3: #f06060;
    --orange: #f0a060; --purple: #a060f0; --radius: 16px; --radius-sm: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Manrope',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:90px; overflow-x:hidden; }

  .nav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; z-index:100; padding-bottom:env(safe-area-inset-bottom); }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; border:none; background:none; color:var(--text3); font-family:'Manrope',sans-serif; font-size:9px; font-weight:600; cursor:pointer; }
  .nav-btn.active { color:var(--accent); }
  .nav-btn svg { width:20px; height:20px; }

  .page { display:none; padding:16px; }
  .page.active { display:block; }
  .page-title { font-size:26px; font-weight:800; margin-bottom:16px; letter-spacing:-0.5px; }

  .card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:10px; border:1px solid var(--border); }
  .card-title { font-size:12px; color:var(--text2); font-weight:600; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }

  /* KCAL BAR */
  .kcal-bar-wrap { height:8px; background:var(--border); border-radius:4px; margin:8px 0; overflow:hidden; }
  .kcal-bar-fill { height:8px; border-radius:4px; transition:width .5s ease, background .3s; }

  /* MEAL CARD */
  .meal-card { background:var(--surface); border-radius:var(--radius); margin-bottom:10px; border:1px solid var(--border); overflow:hidden; }
  .meal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; }
  .meal-header:active { background:var(--surface2); }
  .meal-title { font-size:15px; font-weight:700; }
  .meal-kcal { font-size:12px; color:var(--text2); }
  .meal-body { display:none; padding:0 16px 16px; }
  .meal-body.open { display:block; }

  /* GROUP */
  .group-label { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; margin:12px 0 6px; }
  .food-item { display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:10px; cursor:pointer; margin-bottom:4px; transition:background .15s; }
  .food-item:active { background:var(--surface2); }
  .food-item.selected { background:rgba(200,240,96,0.1); border:1px solid rgba(200,240,96,0.3); }
  .food-item.half { background:rgba(200,240,96,0.05); border:1px solid rgba(200,240,96,0.15); }
  .food-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .food-info { flex:1; }
  .food-name { font-size:13px; font-weight:600; }
  .food-meta { font-size:11px; color:var(--text2); margin-top:1px; }
  .food-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .badge-full { background:rgba(200,240,96,0.2); color:var(--accent); }
  .badge-half { background:rgba(128,128,128,0.2); color:var(--text3); border:1px dashed var(--text3); }
  .optional-tag { font-size:10px; color:var(--text3); background:var(--surface2); padding:1px 6px; border-radius:4px; }

  /* RING */
  svg.ring { transform:rotate(-90deg); }
  .ring-bg { fill:none; stroke:var(--border); stroke-width:6; }
  .ring-fg { fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .6s ease, stroke .3s; }
  .ring-text { font-family:'Manrope',sans-serif; font-weight:800; fill:var(--text); }

  /* INPUT */
  .input-field { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; color:var(--text); font-family:'Manrope',sans-serif; font-size:16px; font-weight:600; outline:none; }
  .input-field:focus { border-color:var(--accent); }
  .btn { width:100%; padding:14px; border-radius:var(--radius-sm); border:none; font-family:'Manrope',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary { background:var(--accent); color:#111; }
  .btn:active { opacity:.8; }

  /* HIST */
  .hist-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .hist-row:last-child { border:none; }

  /* MEASURE */
  .measure-row { display:flex; align-items:center; justify-content:space-between; padding:14px; background:var(--surface); border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid var(--border); cursor:pointer; }

  /* TOAST */
  .toast { position:fixed; bottom:95px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); border:1px solid var(--accent); color:var(--accent); padding:10px 20px; border-radius:30px; font-size:13px; font-weight:600; opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap; z-index:200; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* WEEKLY BALANCE */
  .balance-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; }
</style>
</head>

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
function todayKey() { return new Date().toISOString().slice(0,10); }
function getState() { try { return JSON.parse(localStorage.getItem('fitness_v2')||'{}'); } catch(e) { return {}; } }
function saveState(s) { localStorage.setItem('fitness_v2', JSON.stringify(s)); }

function getTodayRation() {
  const s = getState();
  if (!s.rations) s.rations = {};
  if (!s.rations[todayKey()]) s.rations[todayKey()] = { meals: {}, bonus: null };
  return s.rations[todayKey()];
}
function saveTodayRation(r) {
  const s = getState();
  if (!s.rations) s.rations = {};
  s.rations[todayKey()] = r;
  saveState(s);
}
function getTodaySteps() { const s = getState(); return (s.steps && s.steps[todayKey()]) || 0; }
function saveTodaySteps(v) { const s = getState(); if (!s.steps) s.steps = {}; s.steps[todayKey()] = v; saveState(s); }
function getMeasures() { return getState().measures || {}; }
function saveMeasureEntry(key, val) {
  const s = getState();
  if (!s.measures) s.measures = {};
  if (!s.measures[key]) s.measures[key] = [];
  s.measures[key].push({ date: todayKey(), val });
  saveState(s);
}

// ─── Weekly balance ───────────────────────
function getWeeklyBalance() {
  const s = getState();
  if (!s.rations) return 0;
  let total = 0;
  const today = new Date();
  for (let i = 1; i <= 6; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    if (s.rations[key]) {
      const dayKcal = calcRationKcal(s.rations[key]);
      total += dayKcal - DAILY_KCAL_GOAL;
    }
  }
  return Math.round(total / 6); // avg daily surplus/deficit
}

function calcRationKcal(ration) {
  let total = 0;
  MEALS.forEach(meal => {
    const mealSel = ration.meals[meal.id] || {};
    meal.groups.forEach(group => {
      const sel = mealSel[group.id];
      if (sel) {
        const item = group.items[sel.idx];
        if (item) total += item.kcal * (sel.portion === 'full' ? 1 : 0.5);
      }
    });
  });
  if (ration.bonus) {
    total += BONUS.items[0].kcal * (ration.bonus === 'full' ? 1 : 0.5);
  }
  return Math.round(total);
}

function getTodayKcal() { return calcRationKcal(getTodayRation()); }

function getEffectiveGoal() {
  const balance = getWeeklyBalance();
  if (balance > 100) return Math.max(1100, DAILY_KCAL_GOAL - Math.round(balance * 0.5));
  if (balance < -100) return Math.min(1500, DAILY_KCAL_GOAL + Math.round(Math.abs(balance) * 0.3));
  return DAILY_KCAL_GOAL;
}

function ring(pct, color, size=72) {
  const r = (size-8)/2, circ = 2*Math.PI*r;
  const offset = circ - Math.min(pct/100,1)*circ;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" class="ring-text" transform="rotate(90,${size/2},${size/2})" style="font-size:${size<80?10:13}px">${Math.round(pct)}%</text>
  </svg>`;
}

function kcalColor(kcal, goal) {
  const pct = kcal / goal;
  if (pct < 0.85) return 'var(--accent)';
  if (pct < 1.0) return 'var(--orange)';
  return 'var(--accent3)';
}

function siEmoji(si) {
  if (si === 3) return '🟢';
  if (si === 2) return '🟡';
  return '🔴';
}

// IF HELPERS
// ═══════════════════════════════════════════
function getIFStatus() {
  const s = getState();
  const startHour = s.ifStart !== undefined ? s.ifStart : 12;
  const endHour = startHour + 8;
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const start = startHour*60, end = endHour*60;
  const inWindow = cur >= start && cur < end;
  let remain = inWindow ? end-cur : cur < start ? start-cur : 24*60-cur+start;
  return { inWindow, hours: Math.floor(remain/60), mins: remain%60,
    pct: inWindow ? Math.round((cur-start)/480*100) : 0, startHour, endHour };
}

// RENDER RATION
// ═══════════════════════════════════════════
function renderRation() {
  const ration = getTodayRation();
  const goal = getEffectiveGoal();
  const totalKcal = getTodayKcal();
  const color = kcalColor(totalKcal, goal);
  const pct = Math.min(Math.round(totalKcal/goal*100), 100);

  let html = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;font-weight:700">Всього сьогодні</span>
        <span style="font-size:18px;font-weight:800;color:${color}">${totalKcal} / ${goal} ккал</span>
      </div>
      <div class="kcal-bar-wrap"><div class="kcal-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      ${totalKcal > goal ? `<div style="font-size:11px;color:var(--accent3);margin-top:6px">⚠️ Перевищення на ${totalKcal-goal} ккал</div>` : `<div style="font-size:11px;color:var(--text3);margin-top:6px">Лишилось: ${goal-totalKcal} ккал</div>`}
    </div>
  `;

  // Render each meal
  MEALS.forEach(meal => {
    const mealSel = ration.meals[meal.id] || {};
    let mealKcal = 0;
    meal.groups.forEach(g => {
      const sel = mealSel[g.id];
      if (sel) {
        const item = g.items[sel.idx];
        if (item) mealKcal += item.kcal * (sel.portion==='full'?1:0.5);
      }
    });
    const isOpen = openMeal === meal.id;

    html += `<div class="meal-card">
      <div class="meal-header" onclick="toggleMeal('${meal.id}')">
        <div>
          <div class="meal-title">${meal.icon} ${meal.name}</div>
          <div class="meal-kcal">${Math.round(mealKcal)} / ~${meal.targetKcal} ккал</div>
        </div>
        <span style="color:var(--text3);font-size:20px">${isOpen?'↑':'↓'}</span>
      </div>
      <div class="meal-body ${isOpen?'open':''}">`;

    meal.groups.forEach(group => {
      const sel = mealSel[group.id];
      const remaining = goal - totalKcal + (sel ? (group.items[sel.idx]?.kcal||0)*(sel.portion==='full'?1:0.5) : 0);

      html += `<div class="group-label">${group.icon} ${group.name}${!group.required?' <span class="optional-tag">необов\'язково</span>':''}</div>`;

      group.items.forEach((item, idx) => {
        const isSelected = sel && sel.idx === idx;
        const isFull = isSelected && sel.portion === 'full';
        const isHalf = isSelected && sel.portion === 'half';
        const wouldExceed = !isSelected && (totalKcal + item.kcal) > goal * 1.1;

        html += `<div class="food-item ${isFull?'selected':isHalf?'half':''}" onclick="toggleFood('${meal.id}','${group.id}',${idx})" style="${wouldExceed?'opacity:0.5':''}">
          <div class="food-icon" style="background:${group.required?'rgba(200,240,96,0.1)':'rgba(128,128,128,0.1)'}">
            ${group.icon}
          </div>
          <div class="food-info">
            <div class="food-name">${item.name} ${siEmoji(item.si)}</div>
            <div class="food-meta">${item.unit} · ${item.kcal} ккал · ${item.prot}г білка</div>
          </div>
          ${isFull ? '<span class="food-badge badge-full">Повна</span>' : ''}
          ${isHalf ? '<span class="food-badge badge-half">½</span>' : ''}
        </div>`;
      });
    });

    html += `</div></div>`;
  });

  // Bonus
  const bonusSel = ration.bonus;
  html += `<div class="meal-card">
    <div class="meal-header" onclick="toggleMeal('bonus')">
      <div>
        <div class="meal-title">✨ Будь-що (до 200 ккал)</div>
        <div class="meal-kcal">${bonusSel ? (bonusSel==='full'?200:100) : 0} / 200 ккал</div>
      </div>
      <span style="color:var(--text3);font-size:20px">${openMeal==='bonus'?'↑':'↓'}</span>
    </div>
    <div class="meal-body ${openMeal==='bonus'?'open':''}">
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px">Солодощі, снеки, алкоголь, ресторанна їжа тощо. Максимум 200 ккал.</div>
      <div class="food-item ${bonusSel==='full'?'selected':bonusSel==='half'?'half':''}" onclick="toggleBonus()">
        <div class="food-icon" style="background:rgba(240,160,96,0.1)">✨</div>
        <div class="food-info">
          <div class="food-name">Будь-що на вибір</div>
          <div class="food-meta">до 200 ккал · 1 клік = 100 ккал, 2 кліки = 200 ккал</div>
        </div>
        ${bonusSel==='full' ? '<span class="food-badge badge-full">200 ккал</span>' : ''}
        ${bonusSel==='half' ? '<span class="food-badge badge-half">100 ккал</span>' : ''}
      </div>
    </div>
  </div>`;

  document.getElementById('ration-content').innerHTML = html;
}

function toggleMeal(id) {
  openMeal = openMeal === id ? null : id;
  renderRation();
}

function toggleFood(mealId, groupId, idx) {
  const ration = getTodayRation();
  if (!ration.meals[mealId]) ration.meals[mealId] = {};
  const cur = ration.meals[mealId][groupId];

  if (!cur || cur.idx !== idx) {
    ration.meals[mealId][groupId] = { idx, portion: 'half' };
  } else if (cur.portion === 'half') {
    ration.meals[mealId][groupId] = { idx, portion: 'full' };
  } else {
    delete ration.meals[mealId][groupId];
  }

  saveTodayRation(ration);
  renderRation();
  renderHome();
  showToast('✅ Збережено');
}

function toggleBonus() {
  const ration = getTodayRation();
  if (!ration.bonus) ration.bonus = 'half';
  else if (ration.bonus === 'half') ration.bonus = 'full';
  else ration.bonus = null;
  saveTodayRation(ration);
  renderRation();
  renderHome();
}

// ═══════════════════════════════════════════
// RENDER ANALYTICS
// ═══════════════════════════════════════════
function renderAnalytics() {
  const s = getState();
  const today = new Date();
  const week = Array.from({length:7},(_,i)=>{ const d=new Date(today); d.setDate(d.getDate()-6+i); return d.toISOString().slice(0,10); });

  // Streak
  let streak=0, check=new Date(today);
  while(true) {
    const k=check.toISOString().slice(0,10);
    if(s.rations&&s.rations[k]&&calcRationKcal(s.rations[k])>200) streak++;
    else break;
    check.setDate(check.getDate()-1);
  }

  // Steps
  const stepsData = week.map(d=>(s.steps&&s.steps[d])||0);
  const avgSteps = Math.round(stepsData.reduce((a,b)=>a+b,0)/7);

  // Kcal
  const kcalData = week.map(d=>s.rations&&s.rations[d]?calcRationKcal(s.rations[d]):0);
  const avgKcal = Math.round(kcalData.reduce((a,b)=>a+b,0)/7);

  // Weekly balance
  const balance = getWeeklyBalance();

  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  function miniBar(data, goal, color) {
    const max = Math.max(...data, goal);
    return data.map((v,i)=>{
      const h = Math.round((v/max)*60);
      const isToday = i===6;
      const c = v>=goal ? color : isToday ? 'var(--orange)' : 'var(--border)';
      const dayIdx = new Date(week[i]).getDay();
      const dayName = days[dayIdx===0?6:dayIdx-1];
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1">
        <div style="font-size:9px;color:var(--text3)">${v>0?(v>999?Math.round(v/1000)+'к':v):''}</div>
        <div style="width:100%;height:${Math.max(h,4)}px;background:${c};border-radius:3px"></div>
        <div style="font-size:9px;color:${isToday?color:'var(--text3)'};font-weight:${isToday?700:400}">${dayName}</div>
      </div>`;
    }).join('');
  }

  // Weight
  const weightEntries = (s.measures&&s.measures.weight)||[];
  const lastW = weightEntries[weightEntries.length-1];
  const firstW = weightEntries[0];
  const diff = lastW&&firstW ? (lastW.val-firstW.val).toFixed(1) : null;

  document.getElementById('analytics-content').innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:6px">🔥 Стрік</div>
      <div style="font-size:36px;font-weight:800;color:var(--orange)">${streak} <span style="font-size:14px;font-weight:500">днів</span></div>
    </div>

    <div class="card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">📊 Тижневий баланс</div>
      <div style="font-size:22px;font-weight:800;color:${balance>50?'var(--accent3)':balance<-50?'var(--accent)':'var(--text2)'}">
        ${balance>0?'+':''}${balance} ккал/день
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">
        ${balance>50?`Ліміт скориговано до ${getEffectiveGoal()} ккал`:balance<-50?'Молодець! Є запас':' В нормі'}
      </div>
    </div>

    <div class="card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">🍽 Калорії — тиждень</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">Сер: ${avgKcal} ккал · Ціль: ${DAILY_KCAL_GOAL}</div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:80px;padding-top:16px">${miniBar(kcalData,DAILY_KCAL_GOAL,'var(--accent)')}</div>
    </div>

    <div class="card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">🚶 Кроки — тиждень</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">Сер: ${avgSteps.toLocaleString('uk')}</div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:80px;padding-top:16px">${miniBar(stepsData,DAILY_STEPS_GOAL,'var(--accent2)')}</div>
    </div>

    ${diff!==null?`<div class="card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:6px">⚖️ Динаміка ваги</div>
      <div style="font-size:28px;font-weight:800;color:${parseFloat(diff)<=0?'var(--accent)':'var(--accent3)'}">
        ${parseFloat(diff)>0?'+':''}${diff} кг
      </div>
      <div style="font-size:12px;color:var(--text3)">${firstW.val} кг → ${lastW.val} кг</div>
    </div>`:`<div class="card" style="text-align:center;color:var(--text3);font-size:13px;padding:20px">Додай 2+ записи ваги щоб бачити динаміку ⚖️</div>`}
  `;
}

      <button class="btn btn-primary" onclick="saveIF()">Зберегти</button>
    </div>

    <div class="card">
      <div class="card-title">💡 Поради</div>
      <div style="font-size:13px;color:var(--text3);line-height:1.7">
        • Під час голодування — вода, чай, кава без цукру ✅<br>
        • Перший прийом їжі: білок + клітковина<br>
        • Останній прийом за 1-2 год до закриття вікна<br>
        • При цілі -10 кг: 1200-1300 ккал в день<br>
        • Тренування краще на початку вікна або за 1г до
      </div>
    </div>
  `;
}

function saveIF() {
  const v = parseInt(document.getElementById('if-start').value);
  if(isNaN(v)||v<6||v>16){showToast('Введи від 6 до 16');return;}
  const s=getState(); s.ifStart=v; saveState(s);
  showToast(`✅ Вікно: ${v}:00–${v+8}:00`);
  renderIF(); renderHome();
}

// ═══════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════
function render() {
  if (currentPage==='home') renderHome();
  else if (currentPage==='ration') renderRation();
  else if (currentPage==='steps') renderSteps();
  else if (currentPage==='measures') renderMeasures();
  else if (currentPage==='analytics') renderAnalytics();
  else if (currentPage==='if') renderIF();
}

if (window.Telegram&&window.Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }
setInterval(()=>{ if(currentPage==='home'||currentPage==='if') render(); }, 60000);
render();
</script>

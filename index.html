<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fitness Tracker</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --accent: #c8f060;
    --accent2: #60d4f0;
    --accent3: #f06060;
    --orange: #f0a060;
    --purple: #a060f0;
    --pink: #f060c0;
    --teal: #60f0c0;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  /* NAV */
  .nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px;
    border: none;
    background: none;
    color: var(--text3);
    font-family: 'Manrope', sans-serif;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: color .2s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* PAGES */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* HEADER */
  .page-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  /* PROGRESS RING */
  .ring-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ring-info h3 { font-size: 13px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
  .ring-info .big-num { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .ring-info .sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .ring-info .bar-wrap { margin-top: 10px; height: 4px; background: var(--border); border-radius: 2px; width: 180px; }
  .ring-info .bar-fill { height: 4px; border-radius: 2px; background: var(--accent); transition: width .5s ease; }

  svg.ring { width: 72px; height: 72px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
  .ring-fg { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-text { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 13px; fill: var(--text); }

  /* CATEGORY BADGE */
  .cat-badge {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
    flex-shrink: 0;
  }

  /* FOOD ITEM */
  .food-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
    border-radius: 8px;
    padding-left: 8px;
    padding-right: 8px;
    margin: 0 -8px;
  }
  .food-item:last-child { border-bottom: none; }
  .food-item:active { background: var(--surface2); }
  .food-item.selected { background: rgba(200,240,96,0.08); border-color: rgba(200,240,96,0.2); }
  .food-item.half-selected { background: rgba(200,240,96,0.04); border-color: rgba(200,240,96,0.1); }

  .food-info { flex: 1; }
  .food-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .food-meta { font-size: 11px; color: var(--text2); }

  .portion-badge {
    font-size: 10px; font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1.5px dashed var(--accent);
    color: var(--accent);
    white-space: nowrap;
  }
  .portion-badge.half { border-color: var(--text3); color: var(--text3); }

  /* SECTION TITLE */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 20px 0 10px;
  }

  /* MEAL ROW */
  .meal-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: border-color .2s;
  }
  .meal-row:active { border-color: var(--accent); }
  .meal-num {
    width: 32px; height: 32px;
    background: var(--surface2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800;
    color: var(--text2);
  }
  .meal-text { flex: 1; }
  .meal-text h4 { font-size: 14px; font-weight: 600; }
  .meal-text p { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .chevron { color: var(--text3); font-size: 18px; }

  /* BACK BUTTON */
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--text2); font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; margin-bottom: 16px;
    padding: 4px 0;
  }

  /* INPUT */
  .input-wrap { margin-bottom: 16px; }
  .input-label { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 6px; }
  .input-field {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    transition: border-color .2s;
  }
  .input-field:focus { border-color: var(--accent); }

  /* BUTTON */
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: #111; }
  .btn-secondary { background: var(--surface2); color: var(--text); margin-top: 8px; }

  /* MEASURE ROW */
  .measure-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .measure-row:active { border-color: var(--accent2); }
  .measure-left { display: flex; align-items: center; gap: 12px; }
  .measure-icon { font-size: 20px; }
  .measure-name { font-size: 14px; font-weight: 600; }
  .measure-val { font-size: 14px; font-weight: 700; color: var(--text2); }

  /* SEARCH */
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 16px; }
  .search-field {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px 12px 42px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-field:focus { border-color: var(--accent); }
  .search-field::placeholder { color: var(--text3); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px; font-weight: 600;
    opacity: 0; transition: all .3s;
    pointer-events: none; white-space: nowrap;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* HISTORY LIST */
  .hist-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-date { color: var(--text2); }
  .hist-val { font-weight: 700; }

  /* STEPS DISPLAY */
  .steps-big { font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .steps-goal { font-size: 13px; color: var(--text2); margin-top: 6px; }

  /* COLOR UTILS */
  .c-accent { color: var(--accent); }
  .c-accent2 { color: var(--accent2); }
  .c-orange { color: var(--orange); }
  .c-purple { color: var(--purple); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 40px 20px; color: var(--text3); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }
</style>
</head>

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function getState() {
  const raw = localStorage.getItem('fitness_state');
  return raw ? JSON.parse(raw) : {};
}

function saveState(s) {
  localStorage.setItem('fitness_state', JSON.stringify(s));
}

function getTodayRation() {
  const s = getState();
  const key = todayKey();
  if (!s.rations) s.rations = {};
  if (!s.rations[key]) s.rations[key] = { meals: [{}, {}, {}, {}] };
  return s.rations[key];
}

function saveTodayRation(r) {
  const s = getState();
  if (!s.rations) s.rations = {};
  s.rations[todayKey()] = r;
  saveState(s);
}

function getTodaySteps() {
  const s = getState();
  if (!s.steps) return 0;
  return s.steps[todayKey()] || 0;
}

function saveTodaySteps(v) {
  const s = getState();
  if (!s.steps) s.steps = {};
  s.steps[todayKey()] = v;
  saveState(s);
}

function getMeasures() {
  const s = getState();
  return s.measures || {};
}

function saveMeasureEntry(key, val) {
  const s = getState();
  if (!s.measures) s.measures = {};
  if (!s.measures[key]) s.measures[key] = [];
  s.measures[key].push({ date: todayKey(), val });
  saveState(s);
}

let searchQuery = '';

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-btn')[['home','ration','steps','measures'].indexOf(page)].classList.add('active');
  currentPage = page;
  rationView = 'list';
  measureView = 'list';
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function ring(pct, color, size = 72) {
  const r = (size - 8) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - Math.min(pct / 100, 1) * circ;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}"
      stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central"
      class="ring-text" transform="rotate(90,${size/2},${size/2})" style="font-size:${size < 60 ? 10 : 13}px">${Math.round(pct)}%</text>
  </svg>`;
}

// ═══════════════════════════════════════════════
// RENDER HOME
// ═══════════════════════════════════════════════
function renderHome() {
  const ration = getTodayRation();
  const steps = getTodaySteps();

  // calc totals
  let totalKcal = 0, totalProt = 0, filledCats = 0;
  ration.meals.forEach(meal => {
    Object.entries(meal).forEach(([catKey, sel]) => {
      if (!sel) return;
      const cat = CATEGORIES[catKey];
      const item = cat.items[sel.itemIdx];
      const mult = sel.portion === 'full' ? 1 : 0.5;
      totalKcal += item.kcal * mult;
      totalProt += item.prot * mult;
      if (sel.portion === 'full') filledCats++;
      else filledCats += 0.5;
    });
  });

  const kcalPct = Math.round(totalKcal / DAILY_KCAL_GOAL * 100);
  const stepsPct = Math.round(steps / DAILY_STEPS_GOAL * 100);
  const rationPct = Math.round(filledCats / TOTAL_CATEGORIES * 100);

  document.getElementById('home-content').innerHTML = `
    <div class="card">
      <div class="ring-wrap">
        <div class="ring-info">
          <h3>Раціон сьогодні</h3>
          <div class="big-num c-accent">${Math.round(totalKcal)}<span style="font-size:16px;font-weight:500"> ккал</span></div>
          <div class="sub">Білок: ${Math.round(totalProt)} г &nbsp;·&nbsp; Ціль: ${DAILY_KCAL_GOAL} ккал</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(kcalPct,100)}%"></div></div>
        </div>
        ${ring(kcalPct, 'var(--accent)')}
      </div>
    </div>

    <div class="card">
      <div class="ring-wrap">
        <div class="ring-info">
          <h3>Кроки сьогодні</h3>
          <div class="big-num c-accent2">${steps.toLocaleString('uk')}</div>
          <div class="sub">Ціль: ${DAILY_STEPS_GOAL.toLocaleString('uk')} кроків</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(stepsPct,100)}%;background:var(--accent2)"></div></div>
        </div>
        ${ring(stepsPct, 'var(--accent2)')}
      </div>
    </div>

    <div class="card">
      <div class="ring-wrap">
        <div class="ring-info">
          <h3>Порції заповнено</h3>
          <div class="big-num c-orange">${Math.round(filledCats)}/${TOTAL_CATEGORIES}</div>
          <div class="sub">категорій виконано</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(rationPct,100)}%;background:var(--orange)"></div></div>
        </div>
        ${ring(rationPct, 'var(--orange)')}
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════
// RENDER RATION
// ═══════════════════════════════════════════════
function renderRation() {
  const el = document.getElementById('ration-content');

  if (rationView === 'list') {
    const ration = getTodayRation();
    let html = `<div class="page-title">Раціон</div>`;

    const mealNames = ['Сніданок', 'Обід', 'Перекус', 'Вечеря'];
    for (let i = 0; i < 4; i++) {
      const meal = ration.meals[i];
      const cats = Object.keys(meal).filter(k => meal[k]);
      let kcal = 0, prot = 0;
      cats.forEach(k => {
        const item = CATEGORIES[k].items[meal[k].itemIdx];
        const m = meal[k].portion === 'full' ? 1 : 0.5;
        kcal += item.kcal * m; prot += item.prot * m;
      });
      const summary = cats.length ? `${Math.round(kcal)} ккал · ${Math.round(prot)}г білка` : 'Порожньо';
      html += `<div class="meal-row" onclick="openMeal(${i})">
        <div class="meal-num">${i+1}</div>
        <div class="meal-text">
          <h4>${mealNames[i]}</h4>
          <p>${summary}</p>
        </div>
        <span class="chevron">›</span>
      </div>`;
    }
    el.innerHTML = html;

  } else {
    // meal detail
    const ration = getTodayRation();
    const meal = ration.meals[currentMeal];
    const mealNames = ['Сніданок', 'Обід', 'Перекус', 'Вечеря'];

    let searchHtml = `
      <button class="back-btn" onclick="rationView='list';renderRation()">‹ Назад</button>
      <div class="page-title">${mealNames[currentMeal]}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px;padding:10px 12px;background:var(--surface2);border-radius:10px;">
        💡 1 клік — ½ порції &nbsp;·&nbsp; 2 кліки — повна порція &nbsp;·&nbsp; 3 кліки — скасувати
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-field" placeholder="Пошук інгредієнтів..." 
          oninput="searchQuery=this.value;renderRation()" value="${searchQuery}">
      </div>
    `;

    // Calculate how many halves are used across ALL meals for each category
    const catHalves = {};
    ration.meals.forEach((m, mIdx) => {
      Object.entries(m).forEach(([k, sel]) => {
        if (!sel) return;
        if (!catHalves[k]) catHalves[k] = 0;
        catHalves[k] += sel.portion === 'full' ? 2 : 1;
      });
    });

    let listHtml = '';
    Object.entries(CATEGORIES).forEach(([catKey, cat]) => {
      const filtered = cat.items.filter(item =>
        !searchQuery || item.name.toLowerCase().includes(searchQuery.toLowerCase())
      );
      if (!filtered.length) return;

      listHtml += `<div class="section-title">${catKey} — ${cat.name}</div>`;
      filtered.forEach((item) => {
        const itemIdx = cat.items.indexOf(item);
        const sel = meal[catKey];
        const isSelected = sel && sel.itemIdx === itemIdx;
        const isFull = isSelected && sel.portion === 'full';
        const isHalf = isSelected && sel.portion === 'half';

        // Total halves used in this category across all meals
        const totalHalves = catHalves[catKey] || 0;
        // Is this category fully used (2 halves) and NOT in current meal?
        const isBlocked = totalHalves >= 2 && !isSelected;
        // Is half used in another meal (not current)?
        const halfElsewhere = totalHalves >= 1 && !isSelected;

        let clickHandler = isBlocked ? '' : `onclick="toggleItem('${catKey}', ${itemIdx})"`;
        let extraClass = isFull ? 'selected' : isHalf ? 'half-selected' : '';
        let opacity = isBlocked ? 'opacity:0.3;pointer-events:none;' : '';
        let badge = '';
        if (isFull) badge = '<div class="portion-badge">Повна порція</div>';
        else if (isHalf) badge = '<div class="portion-badge half">½ порції</div>';
        else if (halfElsewhere && !isSelected) badge = '<div class="portion-badge half">½ вже є</div>';

        listHtml += `
          <div class="food-item ${extraClass}" style="${opacity}" ${clickHandler}>
            <div class="cat-badge" style="background:${cat.bg};color:${cat.color}">${catKey}</div>
            <div class="food-info">
              <div class="food-name">${item.name}</div>
              <div class="food-meta">${item.weight}г · ${item.kcal} ккал · ${item.prot}г білка</div>
            </div>
            ${badge}
          </div>`;
      });
    });

    el.innerHTML = searchHtml + listHtml;
  }
}

function openMeal(idx) {
  currentMeal = idx;
  rationView = 'meal';
  searchQuery = '';
  renderRation();
}

function toggleItem(catKey, itemIdx) {
  const ration = getTodayRation();
  const meal = ration.meals[currentMeal];
  const cur = meal[catKey];

  // Count halves used in OTHER meals
  let halvesElsewhere = 0;
  ration.meals.forEach((m, idx) => {
    if (idx === currentMeal) return;
    if (m[catKey]) halvesElsewhere += m[catKey].portion === 'full' ? 2 : 1;
  });

  if (!cur || cur.itemIdx !== itemIdx) {
    // Adding new: only allow if fewer than 2 halves used elsewhere
    if (halvesElsewhere >= 2) return;
    meal[catKey] = { itemIdx, portion: 'half' };
  } else if (cur.portion === 'half') {
    // Upgrading to full: only if no halves elsewhere
    if (halvesElsewhere >= 1) {
      // Can't upgrade to full if half already used elsewhere — remove instead
      delete meal[catKey];
    } else {
      meal[catKey] = { itemIdx, portion: 'full' };
    }
  } else {
    delete meal[catKey];
  }

  saveTodayRation(ration);
  renderRation();
  renderHome();
}

// ═══════════════════════════════════════════════
// RENDER STEPS
// ═══════════════════════════════════════════════
function renderSteps() {
  const steps = getTodaySteps();
  const pct = Math.round(steps / DAILY_STEPS_GOAL * 100);
  const s = getState();
  const stepsHistory = s.steps || {};
  const entries = Object.entries(stepsHistory).sort((a,b) => b[0].localeCompare(a[0])).slice(0,7);

  document.getElementById('steps-content').innerHTML = `
    <div class="card" style="text-align:center;padding:30px 18px">
      <div style="display:flex;justify-content:center;margin-bottom:16px">
        ${ring(pct, 'var(--accent2)', 100)}
      </div>
      <div class="steps-big c-accent2">${steps.toLocaleString('uk')}</div>
      <div class="steps-goal">Ціль: ${DAILY_STEPS_GOAL.toLocaleString('uk')} кроків</div>
    </div>

    <div class="input-wrap">
      <div class="input-label">Кроки сьогодні</div>
      <input class="input-field" type="number" id="steps-input" placeholder="Введи кількість кроків" value="${steps || ''}">
    </div>
    <button class="btn btn-primary" onclick="saveSteps()">Зберегти</button>

    ${entries.length > 1 ? `
      <div class="section-title">Останні 7 днів</div>
      <div class="card">
        ${entries.map(([date, val]) => `
          <div class="hist-row">
            <span class="hist-date">${date}</span>
            <span class="hist-val c-accent2">${Number(val).toLocaleString('uk')}</span>
          </div>`).join('')}
      </div>` : ''}
  `;
}

function saveSteps() {
  const val = parseInt(document.getElementById('steps-input').value);
  if (isNaN(val) || val < 0) { showToast('Введи коректне число'); return; }
  saveTodaySteps(val);
  showToast('🚶 Кроки збережено!');
  renderSteps();
  renderHome();
}

// ═══════════════════════════════════════════════
// RENDER MEASURES
// ═══════════════════════════════════════════════
function renderMeasures() {
  const el = document.getElementById('measures-content');
  const allMeasures = getMeasures();

  if (measureView === 'list') {
    let html = '';
    MEASURES.forEach(m => {
      const entries = allMeasures[m.key] || [];
      const last = entries[entries.length - 1];
      html += `<div class="measure-row" onclick="openMeasure('${m.key}')">
        <div class="measure-left">
          <span class="measure-icon">${m.icon}</span>
          <span class="measure-name">${m.name}</span>
        </div>
        <span class="measure-val">${last ? last.val + ' ' + m.unit : '—'} ›</span>
      </div>`;
    });
    el.innerHTML = html;

  } else if (measureView === 'entry') {
    const m = MEASURES.find(x => x.key === currentMeasureKey);
    const entries = (getMeasures()[currentMeasureKey] || []).slice(-5).reverse();
    el.innerHTML = `
      <button class="back-btn" onclick="measureView='list';renderMeasures()">‹ Назад</button>
      <div class="page-title">${m.icon} ${m.name}</div>
      <div class="input-wrap">
        <div class="input-label">Нове значення (${m.unit})</div>
        <input class="input-field" type="number" step="0.1" id="measure-input" placeholder="Наприклад: ${m.key === 'weight' ? '65.5' : '38'}">
      </div>
      <button class="btn btn-primary" onclick="saveMeasure()">Зберегти</button>
      ${entries.length ? `
        <div class="section-title">Історія</div>
        <div class="card">
          ${entries.map(e => `
            <div class="hist-row">
              <span class="hist-date">${e.date}</span>
              <span class="hist-val">${e.val} ${m.unit}</span>
            </div>`).join('')}
        </div>` : ''}
    `;
  }
}

function openMeasure(key) {
  currentMeasureKey = key;
  measureView = 'entry';
  renderMeasures();
}

function saveMeasure() {
  const val = parseFloat(document.getElementById('measure-input').value);
  if (isNaN(val) || val <= 0) { showToast('Введи коректне значення'); return; }
  saveMeasureEntry(currentMeasureKey, val);
  const m = MEASURES.find(x => x.key === currentMeasureKey);
  showToast(`${m.icon} ${m.name}: ${val} ${m.unit} збережено!`);
  measureView = 'list';
  renderMeasures();
}

// ═══════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════
function render() {
  if (currentPage === 'home') renderHome();
  else if (currentPage === 'ration') renderRation();
  else if (currentPage === 'steps') renderSteps();
  else if (currentPage === 'measures') renderMeasures();
}

// Init Telegram Web App
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

render();
</script>

</html>
